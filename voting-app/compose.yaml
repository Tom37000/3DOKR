services:
  redis:
    image: redis:8.8-alpine
    networks:
      - redis-reseau
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  vote:
    build: ./vote
    ports:
      - "8080:8080"
    networks:
      - redis-reseau
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy

  db:
    image: postgres:16.15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - db-votes:/var/lib/postgresql/data
    networks:
      - db-reseau
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build: ./worker
    networks:
      - redis-reseau
      - db-reseau
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  result:
    build: ./result
    ports:
      - "8081:8888"
    networks:
      - db-reseau
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8888"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-votes:

networks:
  redis-reseau:
  db-reseau: