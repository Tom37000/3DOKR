services:
  redis:
    image: redis:8.8-alpine
    networks:
      - redis-reseau

  vote:
    build: ./vote
    ports:
      - "8080:8080"
    networks:
      - redis-reseau

  db:
    image: postgres:16.15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - db-votes:/var/lib/postgresql/data
    networks:
      - db-reseau

  worker:
    build: ./worker
    networks:
      - redis-reseau
      - db-reseau

  result:
    build: ./result
    ports:
      - "8081:8888"
    networks:
      - db-reseau

volumes:
  db-votes:

networks:
  redis-reseau:
  db-reseau: